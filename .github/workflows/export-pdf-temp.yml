name: Temporary PDF export
on:
  push:
    paths:
      - '.github/workflows/export-pdf-temp.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install export dependencies
        shell: bash
        run: |
          python -m pip install --quiet pillow reportlab playwright
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
            echo "CHROME_BIN=" >> "$GITHUB_ENV"
          fi

      - name: Start local site
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/light-pages-server.log 2>&1 &
          echo $! > /tmp/light-pages-server.pid
          sleep 2

      - name: Capture current site and build PDF
        shell: bash
        run: |
          cat > /tmp/export_pdf.py <<'PY'
          import asyncio, os, math
          from pathlib import Path
          from PIL import Image
          from reportlab.pdfgen import canvas
          from reportlab.lib.utils import ImageReader
          from reportlab.lib.colors import HexColor
          from playwright.async_api import async_playwright

          ROOT = Path.cwd()
          OUT = ROOT / "Light_Pages_Submission.pdf"
          CAP = ROOT / "_pdf_capture"
          CAP.mkdir(exist_ok=True)
          BASE = "http://127.0.0.1:8000/?v=3"

          async def capture_site():
              chrome = os.environ.get("CHROME_BIN") or None
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      executable_path=chrome,
                      args=["--no-sandbox", "--disable-dev-shm-usage"]
                  )
                  page = await browser.new_page(viewport={"width":1600,"height":900}, device_scale_factor=1)
                  ordered = []

                  await page.goto(BASE, wait_until="networkidle")
                  for i in range(1, 12):
                      await page.evaluate("(n) => showSlide(n-1)", i)
                      await page.wait_for_timeout(700 if i not in (10,11) else 3000)

                      if i == 7:
                          states = [
                              ("A", "07a_revisit"),
                              ("B", "07b_another_view"),
                              ("compare", "07c_compare"),
                          ]
                          for state, label in states:
                              await page.evaluate("(s) => renderStage(s)", state)
                              await page.wait_for_timeout(500)
                              path = CAP / f"slide-{label}.jpg"
                              await page.screenshot(path=str(path), type="jpeg", quality=93, full_page=False)
                              ordered.append(path)
                      else:
                          path = CAP / f"slide-{i:02d}.jpg"
                          await page.screenshot(path=str(path), type="jpeg", quality=93, full_page=False)
                          ordered.append(path)

                  await browser.close()
                  return ordered

          def fit(w, h, box_w, box_h):
              s = min(box_w / w, box_h / h)
              return w*s, h*s

          def draw_image_fit(c, path, x, y, w, h):
              with Image.open(path) as im:
                  iw, ih = im.size
              dw, dh = fit(iw, ih, w, h)
              dx = x + (w-dw)/2
              dy = y + (h-dh)/2
              c.drawImage(ImageReader(str(path)), dx, dy, dw, dh, preserveAspectRatio=True, mask='auto')

          def build_pdf(main_pages):
              W, H = 960, 540
              c = canvas.Canvas(str(OUT), pagesize=(W,H), pageCompression=1)
              c.setTitle("Light Pages - Yi (Levy) Liu")

              for path in main_pages:
                  c.setFillColor(HexColor("#191b19"))
                  c.rect(0,0,W,H,fill=1,stroke=0)
                  c.drawImage(ImageReader(str(path)), 0, 0, W, H, preserveAspectRatio=True, mask='auto')
                  c.showPage()

              appendix = [
                  ("01 / Moodboard V1", ["appendix-mood-v1-1.jpg"]),
                  ("02 / Moodboard V2", ["appendix-mood-v2-1.jpg"]),
                  ("03 / Technology Signals", ["appendix-technology-1.jpg"]),
                  ("04 / Peer Feedback", ["appendix-6748.jpg","appendix-6749.jpg","appendix-6750.jpg"]),
                  ("05 / Prototype Explorations", ["appendix-7128.jpg","appendix-7129.jpg","appendix-7130.jpg","appendix-7131.jpg","appendix-7143.jpg"]),
              ]

              for title, files in appendix:
                  chunks = [files[i:i+3] for i in range(0, len(files), 3)]
                  for ci, chunk in enumerate(chunks, start=1):
                      c.setFillColor(HexColor("#f8f7f3"))
                      c.rect(0,0,W,H,fill=1,stroke=0)
                      c.setFillColor(HexColor("#191b19"))
                      c.setFont("Helvetica", 18)
                      suffix = f"  {ci}/{len(chunks)}" if len(chunks) > 1 else ""
                      c.drawString(42, 502, title + suffix)

                      n = len(chunk)
                      gap = 18
                      x0, y0 = 42, 44
                      usable_w, usable_h = W-84, H-104
                      if n == 1:
                          draw_image_fit(c, ROOT/chunk[0], x0, y0, usable_w, usable_h)
                      elif n == 2:
                          bw = (usable_w-gap)/2
                          for j,f in enumerate(chunk):
                              draw_image_fit(c, ROOT/f, x0+j*(bw+gap), y0, bw, usable_h)
                      else:
                          bw = (usable_w-gap*2)/3
                          for j,f in enumerate(chunk):
                              draw_image_fit(c, ROOT/f, x0+j*(bw+gap), y0, bw, usable_h)
                      c.showPage()

              c.save()

          async def main():
              pages = await capture_site()
              build_pdf(pages)
              print(f"Wrote {OUT} ({OUT.stat().st_size} bytes), {len(pages)} presentation pages plus appendix.")

          asyncio.run(main())
          PY
          python /tmp/export_pdf.py

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: light-pages-pdf
          path: Light_Pages_Submission.pdf
          if-no-files-found: error
          retention-days: 1
