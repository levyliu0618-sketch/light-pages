<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Light Pages — Design update</title><link rel="icon" href="data:,"></head><body><div id="lp-arc180-study">
  <style>
    #lp-arc180-study { color:var(--foreground); }
    #lp-arc180-study .heading { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
    #lp-arc180-study .stage { position:relative; width:100%; background:radial-gradient(ellipse at 50% 83%,color-mix(in srgb,var(--orange) 12%,transparent),transparent 64%); }
    #lp-arc180-study canvas { width:100%; height:auto; aspect-ratio:1.5; max-height:520px; display:block; cursor:grab; touch-action:none; }
    #lp-arc180-study canvas:active { cursor:grabbing; }
    #lp-arc180-study .lower { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:12px; align-items:center; }
    #lp-arc180-study .detail { margin-top:10px; }
    @media(max-width:440px) { #lp-arc180-study canvas { aspect-ratio:1.12; } }
  </style><link rel="stylesheet" href="model-frame.css?v=2">
  <div class="heading"><h3>Light Pages · A new perspective</h3><span class="text-small">Drag to change your point of view</span></div>
  <div class="stage"><canvas tabindex="0" role="img" aria-label="Interactive 180-degree accordion model. Two photos extend across the folds; drag to view the book from another side. Photo backgrounds are AI-extended."></canvas></div>
  <div class="viz-controls" aria-label="Viewing position">
    <button class="btn" type="button" data-view="hero" aria-pressed="true">Overview</button>
    <button class="btn" type="button" data-view="left" aria-pressed="false">Left view</button>
    <button class="btn" type="button" data-view="right" aria-pressed="false">Right view</button>
    <button class="btn" type="button" data-view="top" aria-pressed="false">From above</button>
    <button class="btn" type="button" data-view="cover" aria-pressed="false">Fabric cover</button>
  </div>
